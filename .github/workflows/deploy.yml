name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_TARGET: ${{ secrets.VPS_TARGET_PATH }}
        run: |
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            dist/ \
            "${VPS_USER}@${VPS_HOST}:${VPS_TARGET}"

      - name: Deploy Caddy config
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          # Caddy-Site-Config nach /etc/caddy/conf.d/ (dort von der Haupt-Caddyfile
          # via `import` eingebunden). conf.d gehört dem Deploy-User, daher kein sudo.
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p 22" \
            deploy/caddy/vero-wohnbau.caddy \
            "${VPS_USER}@${VPS_HOST}:/etc/caddy/conf.d/vero-wohnbau.caddy"
          # Validieren, dann via Admin-API neu laden (kein sudo nötig).
          ssh -i ~/.ssh/deploy_key "${VPS_USER}@${VPS_HOST}" \
            'caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile \
              && caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile'
